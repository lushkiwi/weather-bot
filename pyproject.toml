[project]
name = "kalshi-weather-bot"
version = "0.1.0"
description = "Read-only Kalshi weather market edge scanner"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
]

[project.scripts]
kalshi-weather-scan = "kalshi_weather_bot.cli:main"
kalshi-weather-paper = "kalshi_weather_bot.paper_cli:main"
kalshi-weather-demo = "kalshi_weather_bot.demo_cli:main"
kalshi-weather-shadow = "kalshi_weather_bot.shadow_cli:main"
kalshi-weather-pnl = "kalshi_weather_bot.pnl_cli:main"
kalshi-weather-calib = "kalshi_weather_bot.calibration:main"
kalshi-weather-runner = "kalshi_weather_bot.runner:main"
kalshi-weather-app = "kalshi_weather_bot.app:main"
kalshi-weather-web = "kalshi_weather_bot.web_ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
