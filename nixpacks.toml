# Railway/Nixpacks build config. The default Python provider installs dependencies but not
# this project itself, so the console scripts never land on PATH. Install the package into a
# known venv; the Railway service start commands invoke /opt/venv/bin/python -m <module>.
providers = ["python"]

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python3.11 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install .",
]

# Default start (the dashboard). Railway overrides this per-service for the cron runner.
[start]
cmd = "/opt/venv/bin/python -m kalshi_weather_bot.web_ui --host 0.0.0.0"
